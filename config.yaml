# Non-secret configuration. Secrets go in .env (see .env.example), never here.
# Env vars override this file: nested keys use "__", e.g. LOGGING__LEVEL=DEBUG.
# Only `logging` is typed in config.py so far; other sections are placeholders
# and get typed when the code that reads them is written.

logging:
  level: INFO          # DEBUG | INFO | WARNING | ERROR
  format: json         # json | console
  log_payloads: false  # true = log question/prompt text (DEBUG only). Keep false.

models:                # pinned; the judge model must never change silently (§5)
  generation: TODO
  embedding: TODO
  judge: TODO

llm:
  timeout_s: 30
  max_attempts: 4

retrieval:
  k: 5

# Access model (sections -> access_group, roles -> groups): config/access.yaml

paths:
  raw_data: data/raw
  chroma: data/chroma
  embedding_cache: .cache/embeddings
